<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking de VI</title>
<style>
  :root {
    color-scheme: light;
    --navy: #1f2a44;
    --ink: #182230;
    --muted: #667085;
    --line: #dfe3e8;
    --surface: #fff;
    --background: #f3f5f8;
    --accent: #0a7a4b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 20px 56px;
    background: var(--background);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  main {
    width: min(1040px, 100%);
    margin: 0 auto;
  }

  header { margin-bottom: 22px; }

  h1 {
    margin: 0 0 8px;
    color: var(--navy);
    font-size: clamp(1.65rem, 4vw, 2.25rem);
  }

  .subtitulo {
    max-width: 780px;
    margin: 0;
    color: var(--muted);
    line-height: 1.55;
  }

  .status {
    padding: 28px;
    text-align: center;
    color: var(--muted);
  }

  .ranking {
    display: grid;
    gap: 14px;
  }

  article {
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 2px 8px rgba(16, 24, 40, .045);
  }

  .estado-cabecalho {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 14px;
    align-items: center;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }

  .posicao {
    display: grid;
    width: 38px;
    height: 38px;
    place-items: center;
    border-radius: 50%;
    background: var(--navy);
    color: #fff;
    font-size: .9rem;
    font-weight: 800;
  }

  h2 {
    margin: 0;
    color: var(--navy);
    font-size: 1.12rem;
  }

  .uf {
    color: var(--muted);
    font-weight: 600;
  }

  .verbas {
    margin: 0;
    padding: 4px 20px;
  }

  .verba {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 18px;
    align-items: start;
    padding: 15px 0;
    border-bottom: 1px solid #edf0f3;
  }

  .verba:last-child {
    border-bottom: 0;
  }

  .verba-info {
    min-width: 0;
  }

  dt {
    font-weight: 700;
    color: #27364d;
  }

  dd {
    margin: 0;
  }

  .descricao {
    margin-top: 4px;
    color: #596579;
    font-size: .88rem;
    line-height: 1.48;
  }

  .descricao strong {
    color: #344054;
    font-weight: 750;
  }

  .valor {
    color: var(--ink);
    font-weight: 750;
    white-space: nowrap;
    text-align: right;
  }

  .mensalizado {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: .72rem;
    font-weight: 500;
  }

  .sem-verbas {
    padding: 18px 20px;
    color: var(--muted);
    font-size: .9rem;
  }

  .rodape-estado {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 13px 20px;
    border-top: 1px solid var(--line);
    background: #f8fafc;
    font-weight: 750;
  }

  .rodape-estado strong {
    color: var(--accent);
    white-space: nowrap;
  }

  @media (max-width: 700px) {
    body {
      padding: 22px 12px 40px;
    }

    .estado-cabecalho {
      grid-template-columns: auto 1fr;
    }

    .verba {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .valor {
      text-align: left;
    }
  }
</style>
</head>

<body>
<main>
  <header>
    <h1>Ranking de VI</h1>

    <p class="subtitulo">
      Estados ordenados pelo total mensal de verbas indenizatórias no final da carreira.
      Foram considerados 20 dias trabalhados por mês. Quando uma verba muda ao longo da progressão,
      são apresentados os valores inicial e final.
    </p>
  </header>

  <section id="ranking" class="ranking" aria-live="polite">
    <p class="status">Carregando ranking…</p>
  </section>

</main>

<script>
  const DIAS_TRABALHADOS = 20;
  const ESCOLARIDADE = "Pós-Graduação/Especialização";

  const moeda = new Intl.NumberFormat("pt-BR", {
    style: "currency",
    currency: "BRL"
  });

  const esc = (texto) => String(texto ?? "").replace(/[&<>'"]/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "'": "&#39;",
    '"': "&quot;"
  })[c]);

  function formatarDescricao(texto) {
    const seguro = esc(texto || "Descrição não informada na base de dados.");

    return seguro.replace(
      /\*\*(.+?)\*\*/g,
      "<strong>$1</strong>"
    );
  }

  const quaseIgual = (a, b) => Math.abs(a - b) < 0.005;

  function datasetEscolaridade(estado) {
    const alternativa = estado.porEscolaridade?.[ESCOLARIDADE];
    return alternativa ? { ...estado, ...alternativa } : estado;
  }

  function valorNoAno(verba, ano, filhos) {
    if (verba.valoresPorFilho) {
      return Number(verba.valoresPorFilho[ano]?.[filhos] || 0);
    }

    if (verba.valoresPorDia) {
      return Number(verba.valoresPorDia[ano]?.[DIAS_TRABALHADOS] || 0);
    }

    return Number(verba.valores?.[ano] || 0);
  }

  function montarEstado(uf, estadoOriginal, anosMax, filhosMin, filhosMax) {
    const estado = datasetEscolaridade(estadoOriginal);

    const verbas = (estado.verbas || [])
      .filter(v => v.natureza === "indenizatoria")
      .map(verba => ({
        ...verba,
        inicial: valorNoAno(verba, 0, filhosMin),
        final: valorNoAno(verba, anosMax, filhosMax)
      }));

    return {
      uf,
      nome: estado.nome,
      verbas,
      totalInicial: verbas.reduce((soma, verba) => soma + verba.inicial, 0),
      totalFinal: verbas.reduce((soma, verba) => soma + verba.final, 0)
    };
  }

  function faixa(inicial, final) {
    return quaseIgual(inicial, final)
      ? moeda.format(final)
      : `${moeda.format(inicial)} – ${moeda.format(final)}`;
  }

  function renderizarEstado(estado, indice) {
    const itens = estado.verbas.length
      ? `
        <dl class="verbas">
          ${estado.verbas.map(verba => `
            <div class="verba">
              <div class="verba-info">
                <dt>${esc(verba.nome)}</dt>
                <dd class="descricao">
                  ${formatarDescricao(verba.descricao)}
                </dd>
              </div>

              <dd class="valor">
                ${faixa(verba.inicial, verba.final)}
                ${verba.recorrencia !== "mensal"
                  ? '<span class="mensalizado">(mensalizado)</span>'
                  : ""}
              </dd>
            </div>
          `).join("")}
        </dl>
      `
      : `
        <p class="sem-verbas">
          Nenhuma verba indenizatória mensal cadastrada.
        </p>
      `;

    return `
      <article>
        <div class="estado-cabecalho">
          <span class="posicao" aria-label="${indice + 1}ª posição">
            ${indice + 1}
          </span>

          <h2>
            ${esc(estado.nome)}
            <span class="uf">(${esc(estado.uf)})</span>
          </h2>

        </div>

        ${itens}

        <div class="rodape-estado">
          <span>Total de verbas indenizatórias</span>
          <strong>
            ${faixa(estado.totalInicial, estado.totalFinal)}
          </strong>
        </div>
      </article>
    `;
  }

  fetch("../dados-grafico.json", { cache: "no-store" })
    .then(resposta => {
      if (!resposta.ok) {
        throw new Error(`HTTP ${resposta.status}`);
      }

      return resposta.json();
    })
    .then(dados => {
      const estados = Object.entries(dados.estados)
        .map(([uf, estado]) => montarEstado(
          uf,
          estado,
          dados.anosMax,
          dados.filhosMin,
          dados.filhosMax
        ))
        .sort(
          (a, b) =>
            b.totalFinal - a.totalFinal ||
            a.nome.localeCompare(b.nome, "pt-BR")
        );

      document.getElementById("ranking").innerHTML =
        estados.map(renderizarEstado).join("");
    })
    .catch(erro => {
      console.error(erro);

      document.getElementById("ranking").innerHTML =
        '<p class="status">Não foi possível carregar os dados do ranking.</p>';
    });
</script>
</body>
</html>
