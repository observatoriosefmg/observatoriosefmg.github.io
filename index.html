<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatório Sefaz-MG</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f9; color: #17324d; }
    main { width: min(90%, 720px); text-align: center; }
    h1 { margin-bottom: 2rem; font-size: clamp(1.8rem, 4vw, 2.6rem); }
    nav { display: grid; gap: 1rem; }
    a { display: block; padding: 1.2rem 1.5rem; border-radius: .6rem; background: #0b5d8c; color: #fff; text-decoration: none; font-size: 1.1rem; transition: background .2s; }
    a:hover, a:focus { background: #083f60; }
  </style>
</head>
<body>
  <main>
    <h1>Observatório Sefaz-MG</h1>
    <nav aria-label="Projetos">
      <a href="/evasao/dist">Observatório</a>
      <a href="/ranking">Ranking salarial dos fiscos</a>
    </nav>
  </main>
</body>
</html>
